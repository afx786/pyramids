services:
  - type: web
    name: pyramids-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pyramids-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://afx786.github.io

databases:
  - name: pyramids-db
    databaseName: pyramids_db
    user: pyramids
    plan: free
